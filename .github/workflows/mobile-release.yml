# Attach the phone app files from a finished "mobile" run to a GitHub release
# (which must already exist), without downloading them anywhere first.
#   gh workflow run mobile-release -f run_id=<mobile run> -f tag=mobile-v1.0.1
name: mobile release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the passed mobile run with the APKs and IPA"
        required: true
      tag:
        description: "Release to attach them to, e.g. mobile-v1.0.1"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: files
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          ls -la files
          gh release upload "$TAG" files/VideoDownloader-*.apk \
            files/VideoDownloader-unsigned.ipa --clobber
