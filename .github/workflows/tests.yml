# Runs the checks on every push and pull request (GitHub -> Actions tab).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (no internet tests)
        run: pytest -q
