[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["downloads"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: uses the real internet (skipped unless RUN_LIVE=1)",
]
